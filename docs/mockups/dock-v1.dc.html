@keyframes dcTwinkle{from{opacity:.15}to{opacity:.9}}
@keyframes dcDrift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcSpinR{to{transform:rotate(-360deg)}}
@keyframes dcHaze{from{opacity:.55;transform:scaleY(1)}to{opacity:1;transform:scaleY(1.12)}}

  }

}
